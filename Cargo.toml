[package]
name = "ruri"
version = "0.1.0"
edition = "2024"
authors = [
    "Seuriin (SSL-ACTX) <seuriin@gmail.com>",
    "Iris-Seravelle <iris.seravelle@gmail.com>",
]
license = "Apache-2.0"
repository = "https://github.com/SSL-ACTX/ruri"

[lib]
name = "ruri"
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "ruri"
path = "src/main.rs"

[dependencies]
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
sha1 = { version = "0.10", default-features = false, features = ["oid"] }
base64 = "0.22"
rand = "0.8"
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
incremental = false

[profile.dev]
opt-level = 0
debug = 1
strip = true
panic = "unwind"
lto = false
codegen-units = 256
incremental = true
